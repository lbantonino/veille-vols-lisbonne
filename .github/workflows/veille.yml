name: Veille des prix Lisbonne

on:
  schedule:
    - cron: '17 * * * *' # chaque heure, à la minute 17 (heure UTC) ; même valeur que passage.minuteUtc dans src/config.ts
  workflow_dispatch: # bouton « Run workflow » pour lancer un passage à la main

permissions:
  contents: write # enregistrer l'historique des prix dans le dépôt
  actions: write # se désactiver tout seul le jour du départ

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Chercher les prix
        id: veille
        run: node src/main.ts
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Enregistrer l'historique
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then exit 0; fi
          git commit --quiet -m "données : passage du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push --quiet

      - name: Arrêter la veille après le départ
        if: steps.veille.outputs.termine == 'true'
        run: gh workflow disable veille.yml
        env:
          GH_TOKEN: ${{ github.token }}
